# ZPOD image config.
# Hardware entries below were confirmed on a live board (2026-10-07).
# Add new pins only from the board itself — do not guess.

image_name: zpod
builder: pi-gen
# Official Raspberry Pi OS builder. Not deprecated as of 2026-10.
# 32-bit images (required for Pi Zero / Zero W) come from branch master.
# Do not use the arm64 branch: Pi Zero and Zero W are BCM2835 armhf only.
pi_gen_repo: https://github.com/RPi-Distro/pi-gen.git
pi_gen_branch: master
# pi-gen's documented default release on master as of 2026. Re-check the
# cloned tree before a real build; older boards may want an older branch.
release: trixie
arch: armhf
deploy_compression: xz
target_hostname: zpod

boards:
  pi0:
    id: pi0
    model: Raspberry Pi Zero
    soc: BCM2835
    wireless: false
    notes: >
      No onboard Wi-Fi or Bluetooth. Do not treat missing wireless firmware
      as a boot failure. Stock filename zeropod-2017-03-02.img.gz.
  pi0w:
    id: pi0w
    model: Raspberry Pi Zero W
    soc: BCM2835
    wireless: true
    wpa_country: "US"  # build.sh default for pi0w
    notes: >
      Onboard Wi-Fi/Bluetooth (brcmfmac). Needs the Pi Zero W wireless
      firmware that Raspberry Pi OS already ships; country code is unset
      on purpose. Stock filename zpod-2017-05-18.img.gz.

# Hardware facts CONFIRMED on a live Pi Zero W ZPOD, 2026-10-07 PT (BCM GPIO
# numbering). See docs/stock-introspection.md. Only these are used by M2.
hardware:
  tft:
    resolution: "320x240"          # landscape
    controller: ili9340-style      # confirmed command set; chip marking not read
    bus: spi0                      # spidev0.0
    cs: 8                          # CE0
    mosi: 10
    sclk: 11
    miso: none
    dc: 25
    reset: none
    backlight_or_power: 27         # held HIGH; role inferred, not proven
    spi_hz: 32000000
    madctl: "0xE8"                 # MV|MX|MY|BGR, columns 0-319, pages 0-239
    init: [SWRESET, 150ms, SLPOUT, 150ms, "COLMOD 0x55", "MADCTL 0x08", INVOFF, NORON, DISPON, "MADCTL 0xE8"]
  buttons:                         # active-low, internal pull-ups
    up: 4
    down: 22
    left: 17
    right: 23
    center: [4, 17, 22, 23]        # no own pin: all four low within ~40 ms
    home: 24
    playpause: 6
    triangle: 13
    square: 12
    circle: 26
    x: 16
    volume_up: 5
    volume_down: 20                # also I2S DIN: pull-up only, never re-mux
  dac:
    chip: TI PCM5122
    bus: i2s
    i2c_bus: 1
    i2c_address: "0x4d"
    dtoverlay: aoide-zpod-dac
    alsa_card: sndrpiaoidezpod
    amp_unmute: {gpio: 14, level: low}   # gpio=14=op,dl; drop serial console
  battery_board:
    fuel_gauge: {chip: MAX17048, i2c_bus: 1, address: "0x36"}
  rtc:
    chip: DS3231
    i2c_bus: 1
    address: "0x68"                # time not set; overlay not enabled yet
  ir:
    dtoverlay: gpio-ir
    gpio_pin: 7  # vendor zpod_res/config.txt only; NOT verified (GPIO7 = SPI0 CE1)
notes:
  sources:
    - https://github.com/howardqiao/zpod/blob/master/zpod_res/config.txt
    - https://github.com/howardqiao/zpod  # aoide-zpod-dac.dtbo compatible ti,pcm5122
    - https://github.com/howardqiao/aoide-dac-drivers/blob/master/aoide_zpod_setup.sh
    - https://github.com/howardqiao/ugeek-screen-setup
  conflicts: >
    Resolved by the 2026-10-07 live probe: buttons match the
    aoide_zpod_setup.sh retrogame.cfg map; the panel is 320x240 on SPI0 CE0
    with DC 25 (not the online ST7789 240x240 claim).
  rejected: >
    dtoverlay=hifiberry-dac is not what these files use.
    192 kHz/24-bit is not stated in the driver or overlay.
