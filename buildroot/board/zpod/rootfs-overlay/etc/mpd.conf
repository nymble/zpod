# ZPOD MPD configuration (Buildroot image). Same as apps/system/etc/mpd/mpd.conf
# except: state on /data and MPD runs as root. The database, play state
# (queue, position) and stickers (play counts, ratings) name /data/var/mpd
# directly (test7; /var/lib/mpd is also a link there), so they survive A/B
# updates and a rootfs swap (docs/LIBRARY.md).
# (no separate mpd user yet). /srv/zpod/media -> /data/media.
music_directory    "/srv/zpod/media/music"
playlist_directory "/srv/zpod/media/playlists"
db_file            "/data/var/mpd/tag_cache"
state_file         "/data/var/mpd/state"
sticker_file       "/data/var/mpd/sticker.sql"
pid_file           "/var/run/mpd.pid"
bind_to_address    "/run/mpd/socket"
bind_to_address    "localhost"
port               "6600"
auto_update        "yes"
auto_update_depth  "4"
restore_paused     "yes"
filesystem_charset "UTF-8"

audio_output {
    type           "alsa"
    name           "ZPOD DAC (PCM5122)"
    device         "hw:CARD=sndrpiaoidezpod"
    # zpod-buttons is the only volume writer (ALSA "Digital", cap 80 %)
    mixer_type     "none"
}
replaygain         "off"
