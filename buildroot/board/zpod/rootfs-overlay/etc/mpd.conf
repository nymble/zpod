# ZPOD MPD configuration (Buildroot image). Same as apps/system/etc/mpd/mpd.conf
# except: state on /data (/var/lib/mpd -> /data/var/mpd) and MPD runs as root
# (no separate mpd user yet). /srv/zpod/media -> /data/media.
music_directory    "/srv/zpod/media/music"
playlist_directory "/srv/zpod/media/playlists"
db_file            "/var/lib/mpd/tag_cache"
state_file         "/var/lib/mpd/state"
sticker_file       "/var/lib/mpd/sticker.sql"
pid_file           "/var/run/mpd.pid"
bind_to_address    "/run/mpd/socket"
bind_to_address    "localhost"
port               "6600"
auto_update        "yes"
auto_update_depth  "4"
restore_paused     "yes"
filesystem_charset "UTF-8"

audio_output {
    type           "alsa"
    name           "ZPOD DAC (PCM5122)"
    device         "hw:CARD=sndrpiaoidezpod"
    # zpod-buttons is the only volume writer (ALSA "Digital", cap 80 %)
    mixer_type     "none"
}
replaygain         "off"
