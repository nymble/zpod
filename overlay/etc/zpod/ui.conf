# zpod-ui settings (INI)
[shutdown]
# What the LCD shows after the Pi has powered off (the panel keeps its last
# frame for as long as the board has power, and 3V3 stays up after halt):
#   message = final "ZPOD off / Safe to power off" screen, backlight on (default;
#             works whether or not GPIO27 switches the backlight)
#   off     = black, display off, backlight (GPIO27) low
screen = message

[battery]
# zpod-battery-guard powers off when SOC < shutdown_pct AND the cell is below
# shutdown_mv AND it is not charging, on 3 reads 30 s apart. 0 = disabled.
shutdown_pct = 5
shutdown_mv = 3600

[display]
# SPI clock for the ILI9340 in MHz: 32 (default, safe), 48 or 64. Try faster
# speeds from the launcher (Settings > Display > Panel SPI speed): the new
# speed is kept only if you press OK within 10 s, otherwise it reverts.
spi_mhz = 32
# GPIO27 drives the backlight: INFERRED (held high by the vendor image; not
# yet proven to switch the LED). Settings > Display > Backlight test.
