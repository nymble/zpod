# zpod-buttons overrides (INI). Defaults are built in; uncomment to change.
# Key names are Linux input codes (see /usr/include/linux/input-event-codes.h).
# GPIOs are fixed by hardware (BCM, active-low) and are not configurable here.
[keys]
# up = KEY_UP              ; GPIO4
# down = KEY_DOWN          ; GPIO22
# left = KEY_LEFT          ; GPIO17
# right = KEY_RIGHT        ; GPIO23
# center = KEY_ENTER       ; GPIO4+17+22+23 low together
# home = KEY_HOME          ; GPIO24
# playpause = KEY_PLAYPAUSE ; GPIO6
# triangle = KEY_I         ; GPIO13
# square = KEY_U           ; GPIO12
# circle = KEY_K           ; GPIO26
# x = KEY_J                ; GPIO16
# volup = KEY_VOLUMEUP     ; GPIO5
# voldown = KEY_VOLUMEDOWN ; GPIO20 (I2S DIN pin; read-only, pull-up only)

[options]
# combo_window_ms = 50
# debounce_ms = 20
# volume_step_pct = 2
# volume_cap_pct = 80            ; 80 % ~ raw 204, just under 0 dB (207)
# key_short_min_ms = 75          ; shorter presses are ignored
# volume_repeat_delay_ms = 650   ; held longer -> repeat
# volume_repeat_ms = 150         ; one step per period while held
# volume_adjusts_alsa = true
