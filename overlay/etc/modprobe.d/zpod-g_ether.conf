# ZPOD: fixed, locally administered MACs so the Mac sees the same USB
# Ethernet interface every boot (g_ether otherwise randomises them).
# host_addr = Mac side, dev_addr = Pi side (usb0). Change the last byte on a
# second ZPOD if both are plugged into one Mac at the same time.
options g_ether host_addr=02:5a:50:4f:44:01 dev_addr=02:5a:50:4f:44:02 iSerialNumber=zpod
