# ZPOD: run the stock first-user setup (userconf.txt) only while the first user
# is still unconfigured; zpod-firstuser may have finished it already (key-only).
# A userconf.txt added after a key-only first boot is applied by
# zpod-firstuser.sh itself (this service is disabled by then).
[Unit]
After=zpod-firstuser.service
ConditionPathExists=/etc/ssh/sshd_config.d/rename_user.conf
