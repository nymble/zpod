schema = 1

[app]
id = "hid-lab"
name = "HID Lab"
version = "0.1.0"
exec = "bin/hid-lab"
icon = "icon.png"
description = "DuckyScript USB keyboard: library, on-device edit, dry-run, confirm-and-arm before every run (owner lab only)"
min_core = "0.13.0"
order = 71
arch = "arm-unknown-linux-musleabihf"
permissions = ["usb-gadget"]

[menu]
path = "Tools"
order = 84

[requires]
launcher_api = 2
input = ["buttons"]
