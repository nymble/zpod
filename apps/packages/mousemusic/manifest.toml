# ZPOD app manifest, schema 1: docs/APP-MANIFEST.md
schema = 1

[app]
id = "mousemusic"
name = "Mouse Music"
version = "0.2.0"
exec = "bin/mousemusic"
icon = "icon.png"
description = "Music Mouse-style generative performance (Laurie Spiegel)"
min_core = "0.5.0"
order = 40
arch = "arm-unknown-linux-musleabihf"
permissions = ["usb-host"]   # may ask the launcher to switch the USB port

[menu]
path = "Generative"
order = 10

# offered when a USB mouse or keyboard is plugged in (input chooser)
[[handles]]
kind = "input"
match = ["mouse", "keyboard"]
label = "Play with the mouse"

[requires]
launcher_api = 2     # USB role switch through the launcher (ctl 2)
input = ["buttons", "mouse", "keyboard"]
