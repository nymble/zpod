# ZPOD app manifest, schema 1: docs/APP-MANIFEST.md
schema = 1

[app]
id = "gps"
name = "GPS"
version = "0.2.0"
exec = "bin/gps"
icon = "icon.png"
description = "USB GPS status: fix, coordinates, satellites (ND-105C)"
min_core = "0.5.0"
order = 60
arch = "arm-unknown-linux-musleabihf"
permissions = ["usb-host"]

[menu]
path = "Tools/Radio"
order = 10

# GlobalSat ND-105C: Prolific PL2303 bridge (the ID is the chip's, so any
# PL2303 serial adapter matches too); NMEA 0183 on the serial port
[[handles]]
kind = "usb-device"
match = ["067b:2303"]
label = "GPS receiver"

[[handles]]
kind = "serial"
match = ["nmea"]

[requires]
launcher_api = 2
usb_host = true
input = ["buttons"]
