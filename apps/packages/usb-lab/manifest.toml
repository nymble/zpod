# ZPOD app manifest, schema 1: docs/APP-MANIFEST.md
schema = 1

[app]
id = "usb-lab"
name = "USB Lab"
version = "0.1.0"
exec = "bin/usb-lab"
icon = "icon.png"
description = "USB inspector: devices, descriptors, HID report maps, keystroke-injector warnings (read-only)"
min_core = "0.13.0"
order = 70
arch = "arm-unknown-linux-musleabihf"
permissions = ["usb-host"]

[menu]
path = "Tools"
order = 82

[requires]
launcher_api = 2
usb_host = true
input = ["buttons"]
