# Pipit default voice bank. Every sound is synthesized from these numbers
# (no samples). Format: docs/PIPIT-DESIGN.md "Voice bank". Units: seconds,
# Hz, 0..1 unless noted. Unknown keys or out-of-range values are rejected.
format = "pipit-voices"
version = 1

