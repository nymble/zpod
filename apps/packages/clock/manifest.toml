# ZPOD app manifest, schema 1: docs/APP-MANIFEST.md
schema = 1

[app]
id = "clock"
name = "Clock"
version = "1.2.0"
exec = "bin/clock"
icon = "icon.png"
description = "Clock faces, alarm and countdown timer"
