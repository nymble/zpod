# ZPOD app manifest, schema 1: docs/APP-MANIFEST.md
schema = 1

[app]
id = "wifi-lab"
name = "Wi-Fi Lab"
version = "0.1.0"
exec = "bin/wifi-lab"
icon = "icon.png"
description = "Wi-Fi monitor with a USB adapter: channels, pcap capture, drone Remote ID (receive + gated TEST transmit)"
min_core = "0.13.0"
order = 72
arch = "arm-unknown-linux-musleabihf"
permissions = ["usb-host"]

[menu]
path = "Tools/Radio"
order = 30

[[handles]]
kind = "usb-device"
match = ["148f:5370", "148f:5372", "148f:3070", "148f:7601"]
label = "Wi-Fi monitor adapter"

[requires]
launcher_api = 2
usb_host = true
input = ["buttons"]
