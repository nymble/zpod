[package]
name = "zpod-wifi-lab"
description = "ZPOD Wi-Fi Lab (Tools > Radio): receive-only monitor capture on a USB Wi-Fi adapter, drone Remote ID (Beacon + NAN) aircraft list and detail, frame counters, pcap capture to /data"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "wifi-lab"
path = "src/main.rs"

[dependencies]
zpod-wlan = { path = "../zpod-wlan" }
zpod-remoteid = { path = "../zpod-remoteid" }
zpod-labd = { path = "../zpod-labd" }
zpod-labui = { path = "../zpod-labui" }
zpod-core.workspace = true
zpod-hal.workspace = true
zpod-ui.workspace = true
zpod-input.workspace = true
libc.workspace = true
