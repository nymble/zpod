# Pipit default voice bank. Every sound is synthesized from these numbers
# (no samples, nothing to license). Format: docs/PIPIT-DESIGN.md "Voice
# bank". Units: seconds, Hz, 0..1 unless noted. Unknown keys or out-of-range
# values are rejected. category = browser group (a-z), desc = one line.
format = "pipit-voices"
version = 2

[[voice]]
