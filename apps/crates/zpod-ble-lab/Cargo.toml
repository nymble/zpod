[package]
name = "zpod-ble-lab"
description = "ZPOD BLE Lab (Tools): passive BLE advertising scanner with classification (drone Remote ID, Apple Continuity, beacons, trackers), detail with hex, JSONL capture to /data"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "ble-lab"
path = "src/main.rs"

[dependencies]
zpod-ble = { path = "../zpod-ble" }
zpod-labd = { path = "../zpod-labd" }
zpod-labui = { path = "../zpod-labui" }
zpod-core.workspace = true
zpod-hal.workspace = true
zpod-ui.workspace = true
libc.workspace = true
