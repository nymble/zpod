[package]
name = "zpod-labd"
description = "ZPOD lab helper: root daemon on /run/zpod-labd.sock — USB Wi-Fi monitor/receive, passive BLE scan, and gated TEST Remote ID transmit / HID arm (tx-arm required every time; never armed at boot)"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "zpod-labd"
path = "src/main.rs"

[dependencies]
libc.workspace = true
zpod-wlan = { path = "../zpod-wlan" }
zpod-remoteid = { path = "../zpod-remoteid" }
