# zpod-drop settings. Peers on the USB link (10.12.194.0/28) never need a token.
# Uploads over Wi-Fi are refused unless a token (>= 8 chars) is set here; then
# open http://zpod.local:8080/?token=<token> . Generate one ON THE PI with:
#   sudo sh -c 'echo "token = $(head -c 12 /dev/urandom | base64 | tr -d /+=)" >> /etc/zpod/drop.conf'
# Never commit a real token to the repo.
music_dir = /srv/zpod/media/music
# token =
