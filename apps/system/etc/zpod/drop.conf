# zpod-drop settings (drop box web page + OPDS book catalog, port 8080).
# Tools > Drop box and Tools > Book catalog switch them; both are off by
# default and the socket only listens while one of them is on.
#
# Peers on the USB link (10.12.194.0/28) and on the ZPOD's own hotspot
# (10.42.0.0/24) never need a token. Over the home Wi-Fi everything is refused
# unless a token (>= 8 chars) is set here; then open
#   http://zpod.local:8080/?token=<token>           (drop box)
#   http://zpod.local:8080/opds  password = <token> (e-book reader app)
# Generate one ON THE PI with:
#   sudo sh -c 'echo "token = $(head -c 12 /dev/urandom | base64 | tr -d /+=)" >> /etc/zpod/drop.conf'
# Never commit a real token to the repo.
dropbox = off
opds = off
music_dir = /srv/zpod/media/music
books_dir = /data/books
inbox_dir = /data/inbox
# largest single upload, MiB (1..2048); uploads also stop 64 MiB before /data is full
max_upload_mb = 1024
# token =
