# ZPOD optional rsync share (M5). OFF by default.
# On/off: File transfer screen (Square), or
#   sudo systemctl enable --now zpod-rsyncd.socket   /   disable --now
# It listens on the USB link only (10.12.194.1:873; see zpod-rsyncd.socket)
# and has NO password: anyone who plugs a cable into this ZPOD while it is on
# can read and write the music folder. Leave it off when you do not need it;
# ssh/rsync over ssh (always available) is the secure way.
# From the Mac:  rsync -rtv --progress ~/Music/Album rsync://10.12.194.1/music/
uid = 1000
gid = 1000
use chroot = yes
max connections = 2
reverse lookup = no
hosts allow = 10.12.194.0/28
hosts deny = *
timeout = 600
munge symlinks = yes

[music]
	path = /srv/zpod/media/music
	comment = ZPOD music library
	read only = no
	list = yes
	incoming chmod = Du=rwx,Dg=rwx,Do=rx,Fu=rw,Fg=rw,Fo=r
	# tell MPD about new files when an upload finishes
	post-xfer exec = /usr/bin/mpc -q update
