# ZPOD MPD configuration (installed as /etc/mpd.conf by stage2-06-zpod-m4).
music_directory    "/srv/zpod/media/music"
playlist_directory "/srv/zpod/media/playlists"
db_file            "/var/lib/mpd/tag_cache"
state_file         "/var/lib/mpd/state"
sticker_file       "/var/lib/mpd/sticker.sql"
user               "mpd"
bind_to_address    "/run/mpd/socket"
bind_to_address    "localhost"
port               "6600"
# Rescan automatically when files change (inotify); zpod-drop and
# zpod-push-music.sh also request an update explicitly.
auto_update        "yes"
auto_update_depth  "4"
restore_paused     "yes"
filesystem_charset "UTF-8"
# Album art: cover.jpg/png in the album folder (MPD "albumart") or embedded
# pictures ("readpicture"); the music app caches 120x120 thumbnails.

audio_output {
    type           "alsa"
    name           "ZPOD DAC (PCM5122)"
    device         "hw:CARD=sndrpiaoidezpod"
    # zpod-buttons is the only volume writer (ALSA "Digital", cap 80 %):
    # MPD must not restore or change it (docs/ui/BUTTONS-AND-MENUS.md).
    mixer_type     "none"
}
# Pi Zero (ARMv6, single core): keep decoding cheap.
replaygain         "off"
